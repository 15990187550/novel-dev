defaults:
  timeout: 30
  retries: 2
  temperature: 0.7
  max_tokens: 8192
models:
  kimi-for-coding:
    provider: anthropic
    model: kimi-for-coding
    base_url: https://api.kimi.com/coding
    api_key_env: KIMI_API_KEY
    structured_output:
      mode: anthropic_tool
      fallback_to_text: true
  minimax-2-7:
    provider: anthropic
    model: Minimax-3
    base_url: https://api.minimaxi.com/anthropic
    api_key_env: MINIMAX_API_KEY
    structured_output:
      mode: anthropic_tool
      fallback_to_text: true
  deepseek:
    provider: anthropic
    model: deepseek-v4-flash
    base_url: https://api.aicodewith.com
    api_key_env: DEEPSEEK_API_KEY
    structured_output:
      mode: anthropic_tool
      tool_choice: auto
      fallback_to_text: true
embedding:
  provider: openai_compatible
  model: bge-m3
  base_url: http://127.0.0.1:9997/v1
  timeout: 30
  retries: 3
  dimensions: 1024
agents:
  brainstorm_agent:
    model: deepseek
    timeout: 240
    retries: 3
    temperature: 0.9
    fallback:
      model: minimax-2-7
      timeout: 240
      temperature: 0.9
      retries: 1
    tasks:
      generate_synopsis:
        temperature: 0.9
        max_tokens: 32768
      generate_synopsis_top_level:
        temperature: 0.9
        max_tokens: 8192
      generate_synopsis_volume_outlines_batch:
        temperature: 0.85
        max_tokens: 8192
      score_synopsis:
        temperature: 0.2
  volume_planner_agent:
    model: deepseek
    timeout: 240
    fallback:
      model: kimi-for-coding
      timeout: 240
      temperature: 0.85
      retries: 1
    tasks:
      generate_volume_plan:
        timeout: 120
        retries: 3
        temperature: 0.85
        max_tokens: 8192
        orchestration:
          enabled: false
          tool_allowlist:
          - get_volume_planner_context
          - get_novel_state
          - get_synopsis
          - get_novel_documents
          - get_novel_document_full
          max_tool_calls: 3
          tool_timeout_seconds: 5
          max_tool_result_chars: 6000
          retriever_subtasks: []
          enable_subtasks: true
          repairer_subtask: schema_repair
      expand_volume_plan_batch:
        timeout: 120
        retries: 3
        temperature: 0.55
        max_tokens: 8192
      score_volume_plan:
        temperature: 0.2
      revise_volume_plan:
        temperature: 0.65
    retries: 2
    temperature: 0.85
  setting_extractor_agent:
    model: deepseek
    timeout: 200
    fallback:
      model: minimax-2-7
      temperature: 0.2
      timeout: 180
      retries: 2
    tasks:
      extract_setting:
        temperature: 0.35
        max_tokens: 65536
        timeout: 240
        retries: 3
    retries: 1
    temperature: 0.2
  setting_consolidation_agent:
    model: deepseek
    timeout: 240
    temperature: 0.1
    max_tokens: 65536
    fallback:
      model: minimax-2-7
      temperature: 0.1
      timeout: 240
      retries: 1
    retries: 2
    tasks:
      consolidate:
        temperature: 0.1
        max_tokens: 65536
        timeout: 240
        retries: 3
  style_profiler_agent:
    model: deepseek
    timeout: 60
    fallback:
      model: minimax-2-7
      temperature: 0.5
      timeout: 60
      retries: 1
    retries: 2
    temperature: 0.5
  file_classifier:
    model: kimi-for-coding
    timeout: 60
    fallback:
      model: minimax-2-7
      temperature: 0.5
      timeout: 60
      retries: 1
    retries: 2
    temperature: 0.5
  entity_classifier_agent:
    model: deepseek
    timeout: 60
    temperature: 0.2
    fallback:
      model: minimax-2-7
      temperature: 0.2
      timeout: 60
      retries: 1
    retries: 2
  outline_workbench_service:
    model: deepseek
    timeout: 180
    temperature: 0.5
    fallback:
      model: minimax-2-7
      temperature: 0.5
      timeout: 180
      retries: 1
    retries: 2
    tasks:
      revise_synopsis_with_feedback:
        timeout: 180
        retries: 1
        temperature: 0.5
        fallback:
          model: minimax-2-7
          timeout: 120
          retries: 1
          temperature: 0.5
  setting_workbench_service:
    model: deepseek
    timeout: 180
    temperature: 0.55
    max_tokens: 12000
    orchestration:
      enabled: true
      tool_allowlist:
      - get_setting_workbench_context
      - query_entity
      - get_novel_state
      - get_novel_documents
      - search_domain_documents
      - get_novel_document_full
      max_tool_calls: 20
      tool_timeout_seconds: 50
      max_tool_result_chars: 6000
      retriever_subtasks: []
      enable_subtasks: true
      repairer_subtask: schema_repair
    fallback:
      model: minimax-2-7
      temperature: 0.55
      timeout: 180
      retries: 1
    retries: 2
  context_agent:
    model: minimax-2-7
    timeout: 60
    orchestration:
      enabled: true
      tool_allowlist:
      - get_context_location_details
      - get_context_entity_states
      - get_context_foreshadowing_details
      - get_context_timeline_events
      - get_novel_state
      - get_chapter_draft_status
      max_tool_calls: 20
      tool_timeout_seconds: 50
      max_tool_result_chars: 3200
      retriever_subtasks: []
      enable_subtasks: true
      validator_subtask: location_context_quality
      repairer_subtask: schema_repair
    fallback:
      model: deepseek
      temperature: 0.45
      retries: 1
      timeout: 60
    retries: 2
    temperature: 0.45
  writer_agent:
    model: kimi-for-coding
    timeout: 120
    temperature: 0.9
    fallback:
      model: deepseek
      temperature: 0.9
      timeout: 120
      retries: 1
    tasks:
      generate_chapter:
        temperature: 0.8
      generate_beat:
        temperature: 0.8
      rewrite_beat:
        temperature: 0.65
      generate_relay:
        model: deepseek
        timeout: 15
        temperature: 0.2
        fallback:
          model: minimax-2-7
          temperature: 0.2
          timeout: 15
          retries: 1
    retries: 2
  critic_agent:
    model: deepseek
    timeout: 180
    temperature: 0.3
    fallback:
      model: kimi-for-coding
      temperature: 0.3
      timeout: 60
      retries: 1
    tasks:
      score_chapter:
        temperature: 0.2
        max_tokens: 8192
      score_beats:
        temperature: 0.2
    retries: 2
  editor_agent:
    model: kimi-for-coding
    timeout: 120
    temperature: 0.6
    fallback:
      model: deepseek
      temperature: 0.6
      timeout: 120
      retries: 1
    tasks:
      polish_beat:
        temperature: 0.6
    retries: 2
  chapter_structure_guard_service:
    model: kimi-for-coding
    timeout: 35
    temperature: 0.1
    fallback:
      model: deepseek
      temperature: 0.1
      timeout: 35
      retries: 1
    tasks:
      check_writer_beat:
        temperature: 0.1
        max_tokens: 2048
      check_editor_beat:
        temperature: 0.1
        max_tokens: 2048
    retries: 2
  fast_review_agent:
    model: deepseek
    timeout: 90
    temperature: 0.2
    fallback:
      model: kimi-for-coding
      temperature: 0.2
      timeout: 60
      retries: 1
    tasks:
      fast_review_check:
        temperature: 0.2
    retries: 2
  librarian_agent:
    model: kimi-for-coding
    timeout: 180
    temperature: 0.2
    fallback:
      model: minimax-2-7
      temperature: 0.2
      timeout: 60
      retries: 1
    tasks:
      extract:
        temperature: 0.15
        max_tokens: 8192
    retries: 2
quality_thresholds:
  publishable_final_review_score: 82
  critical_dimension_min_score: 75
  judge_consistency:
    stable_max_cv: 0.05
    moderate_max_cv: 0.10
  recommendation:
    block_threshold: 60
    minor_repair_min_score: 78
    minor_repair_min_critical: 72
    major_repair_min_score: 70
    stop_after_attempts: 3
    pattern_issue_threshold: 3
    max_auto_rewrites: 2            # 阶段二：自动重写硬上限
issue_code_hints:
  AI_FLAVOR_HIGH:
    severity: warn
    threshold: 3
    hint: "检查 editor_agent.py 的 ai_flavor 关键词列表;考虑在 EditorAgent 改写规则中强化对短句堆砌的检查"
  BEAT_BOUNDARY_VIOLATION:
    severity: block
    threshold: 2
    hint: "Writer 节拍边界问题,通常源于 writer 提前执行后续 beat 的事件。在 WriterAgent prompt 中强化 'must stay in beat scope' 指令"
  EXPORT_FAILED:
    severity: block
    threshold: 1
    hint: "导出步骤失败,检查 export_service.py 的路径回传和文件落盘时序"
  CONSISTENCY_BROKEN:
    severity: block
    threshold: 1
    hint: "设定一致性被破坏,检查 ContextAgent 注入的 worldview 是否完整,以及 Writer 是否引用了已变更的实体状态"
  WORD_COUNT_DRIFT:
    severity: warn
    threshold: 2
    hint: "字数偏离目标 ±10%,检查 StoryQualityService 的 beat 字数分配数学"
  REVIEW_TIMEOUT:
    severity: warn
    threshold: 1
    hint: "Reviewing 阶段超时,考虑拆分 critic prompt 减少单次输入长度,或增加 timeout"
  LLM_PARSE_ERROR:
    severity: block
    threshold: 1
    hint: "LLM 输出无法解析,检查 call_and_parse 的 retry 逻辑和 prompt 中的 JSON 格式指令"
  HUMANITY_LOW:
    severity: warn
    threshold: 2
    hint: "humanity 维度偏低,检查 writer 是否有过度抽象描写或角色行为公式化"
  PLOT_TENSION_LOW:
    severity: warn
    threshold: 2
    hint: "plot_tension 偏低,检查 beat 是否包含有效冲突或悬念"
  HOOK_WEAK:
    severity: warn
    threshold: 2
    hint: "章末钩子弱,检查 writer 是否在结尾留下未解悬念或反转"
  EVENT_ORDER_DRIFT:
    severity: block
    threshold: 1
    hint: "事件顺序错乱,通常源于 writer 在 beat 写作时跳过了前置事件"
  PLANNED_CHARACTER_DRIFT:
    severity: block
    threshold: 1
    hint: "出现计划外人物或对计划人物的误用,检查 context 注入和 prompt 中的角色约束"
  FORESHADOW_LEAKED:
    severity: block
    threshold: 1
    hint: "伏笔被提前兑现,检查 NarrativeConstraintBuilder 的 foreshadow_only 列表是否正确应用"
  LLM_JUDGE_INCONSISTENT:
    severity: warn
    threshold: 1
    hint: "LLM 评分一致性偏低(variance_coefficient > 0.10),考虑降低 critic temperature 或增加 ensemble 投票"
